name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A superseded run tells us nothing. Cancel it and spend the minutes on the
# current commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  TURBO_TELEMETRY_DISABLED: 1

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      # API tests exercise auth and learner routes against a real database.
      # The service is reachable at localhost:5432 from every step below.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lingua
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lingua"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Matches .env.example. Prisma reads this directly; the config package
      # default alone is not enough for the client or the test run.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lingua
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Locate the pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # No migrations exist yet, so sync the schema directly. The test run
      # creates its own rows (timestamped signup emails); no seed needed.
      - name: Sync test database schema
        run: pnpm --filter @lingua/db exec prisma db push

      - name: Test
        run: pnpm test

  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every source file must declare its license so the boundary between
      # Apache-2.0 code and CC BY-NC-4.0 content is never ambiguous.
      - name: Check SPDX headers
        run: |
          missing=0
          while IFS= read -r file; do
            case "$file" in
              # Generated by the framework and rewritten on every build, so a
              # header here cannot survive.
              */next-env.d.ts) continue ;;
            esac
            if ! head -n 3 "$file" | grep -q "SPDX-License-Identifier: Apache-2.0"; then
              echo "::error file=$file::Missing SPDX-License-Identifier: Apache-2.0 in the first 3 lines."
              missing=1
            fi
          done < <(git ls-files '*.ts' '*.tsx' | grep -E '^(apps|packages)/')
          exit $missing

      - name: Check the content license declaration
        run: |
          if ! grep -q "CC BY-NC-4.0" content/LICENSE; then
            echo "::error file=content/LICENSE::content/LICENSE must declare CC BY-NC-4.0."
            exit 1
          fi

      # Content is data, licensed separately. Importing it as a module would
      # pull CC BY-NC material into Apache-2.0 code.
      - name: Check that source does not import content
        run: |
          if git ls-files apps packages | xargs -r grep -l -E 'from "content/|require\("content/'; then
            echo "::error::Source files must not import from content/. Content is loaded as data."
            exit 1
          fi

  commits:
    name: Commit policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required to read the pull request's commits.
          fetch-depth: 0

      # DCO is checked per pull request rather than per push to main, because a
      # squash merge does not carry the individual sign-off lines into the
      # commit it creates on main.
      - name: Check DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <[^>]+@[^>]+>'; then
              echo "::error::Commit $sha is missing a Signed-off-by line. Use 'git commit -s'."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
