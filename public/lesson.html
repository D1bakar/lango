<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Lesson: flashcards, typing, listening, quiz." />
  <title>Lesson — Lango</title>
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/fonts.css" /><link rel="stylesheet" href="./css/tokens.css" /><link rel="stylesheet" href="./css/base.css" /><link rel="stylesheet" href="./css/components.css" /><link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="shell"></div>
  <main data-content>
    <div class="page-h"><p class="eyebrow" id="course-label">Loading…</p><h1 id="step-label" style="font-size:28px">Step 1</h1><div class="progress" style="margin-top:12px" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar-wrap"><i id="bar" style="width:0%"></i></div></div>
    <div id="notice" class="notice notice-error" hidden></div>
    <section id="card-section" class="stack" aria-labelledby="card-front">
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap" role="tablist" aria-label="Modes"><button class="pill" data-mode="cards" aria-selected="true">Cards</button><button class="pill" data-mode="typing" aria-selected="false">Typing</button><button class="pill" data-mode="listening" aria-selected="false">Listening</button><button class="pill" data-mode="quiz" aria-selected="false">Quiz</button></div>
      <div id="flip" class="flip card" tabindex="0" role="button" aria-label="Flashcard. Enter to flip." style="cursor:pointer"><div class="flip-inner"><div class="flip-face"><p class="eyebrow">Front</p><p id="card-front" style="font-size:34px;font-weight:700;letter-spacing:-0.02em">—</p><p id="card-roman" style="color:var(--muted)"></p><button id="speak" class="btn btn-ghost" style="margin-top:12px;min-height:40px">Hear it</button></div><div class="flip-face flip-back"><p class="eyebrow">Back</p><p id="card-back" style="font-size:34px;font-weight:700">—</p><p id="card-ex" style="color:var(--muted);font-size:14px"></p></div></div></div>
      <div style="display:flex;gap:12px"><button id="prev" class="btn btn-ghost" style="flex:1">Back</button><button id="reveal" class="btn btn-ghost" style="flex:1">Reveal</button><button id="next" class="btn btn-primary" style="flex:1">Next</button></div>
      <div id="typing-box" class="card" hidden><label for="typing-in" style="font-weight:600">Type “<span id="typing-q">—</span>”</label><div style="display:flex;gap:8px;margin-top:8px"><input id="typing-in" class="input" autocomplete="off" placeholder="Type here…" /><button id="typing-check" class="btn btn-apple">Check</button></div><p id="typing-fb" style="min-height:24px;font-weight:600" aria-live="polite"></p></div>
      <div id="listen-box" class="card" hidden><p style="font-weight:600">Listen and pick</p><button id="listen-play" class="btn btn-primary" style="margin-top:8px">Play audio</button><div id="listen-opts" style="display:grid;gap:8px;margin-top:12px"></div></div>
      <button id="to-quiz" class="btn btn-apple" style="width:100%" hidden>Start check</button>
    </section>
    <section id="quiz-section" class="stack" hidden aria-labelledby="quiz-q"><h2 id="quiz-q" style="font-size:24px">—</h2><p id="quiz-progress" style="color:var(--muted)">Q1/5</p><div id="options" style="display:grid;gap:8px"></div><p id="feedback" style="min-height:24px;font-weight:600" aria-live="polite"></p><button id="quiz-next" class="btn btn-primary" hidden>Next</button></section>
    <section id="done-section" class="card" style="text-align:center" hidden><h2>Lesson complete</h2><p id="score" style="color:var(--muted)">0/5</p><p id="xp-earned" style="font-weight:700;color:var(--success)">+0 XP</p><div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap"><button id="retry" class="btn btn-ghost">Retry</button><a href="./review.html" class="btn btn-primary">Review</a></div></section>
  </main>
  <script type="module">
    import { loadLanguages, getQuery } from "./js/loader.js";
    import { loadStore, saveStore, addXp, markDone } from "./js/store.js";
    import { mountShell } from "./js/shell.js";
    import { speak } from "./js/tts.js";
    import { gradeWord } from "./js/srs.js";
    mountShell({ active: "courses", layout: "narrow" });
    const store = loadStore();
    const bar=document.getElementById("bar"), wrap=document.getElementById("bar-wrap"), step=document.getElementById("step-label"), courseLabel=document.getElementById("course-label"), notice=document.getElementById("notice");
    const flip=document.getElementById("flip"), frontEl=document.getElementById("card-front"), backEl=document.getElementById("card-back"), romanEl=document.getElementById("card-roman"), exEl=document.getElementById("card-ex");
    let langData=null, cards=[], idx=0, mode="cards", qi=0, correct=0, quizSet=[];
    function prog(p,l){ bar.style.width=p+"%"; wrap.setAttribute("aria-valuenow",Math.round(p)); step.textContent=l; }
    function norm(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim(); }
    function showCard(){ const c=cards[idx]; if(!c) return; flip.classList.remove("flipped"); frontEl.textContent=c.front; backEl.textContent=c.back; romanEl.textContent=c.roman||""; exEl.textContent=(c.example||""); prog(((idx+1)/(cards.length+5))*100,`Card ${idx+1} of ${cards.length}`); document.getElementById("typing-q").textContent=c.front; document.getElementById("to-quiz").hidden = idx!==cards.length-1; }
    flip.addEventListener("click",(e)=>{ if(e.target.closest("button")) return; flip.classList.toggle("flipped"); });
    document.getElementById("reveal").onclick=()=>flip.classList.toggle("flipped");
    document.getElementById("prev").onclick=()=>{ if(idx>0){idx--; showCard();} };
    document.getElementById("next").onclick=()=>{ if(idx<cards.length-1){idx++; showCard();} else startQuiz(); };
    document.getElementById("to-quiz").onclick=startQuiz;
    document.getElementById("speak").onclick=(e)=>{ e.stopPropagation(); const c=cards[idx]; if(c) speak(c.back,{lang:langData.tag, rate: loadStore().settings.ttsRate||1}); };
    document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-selected",x===b?"true":"false")); document.getElementById("typing-box").hidden=mode!=="typing"; document.getElementById("listen-box").hidden=mode!=="listening"; if(mode==="listening") renderListen(); });
    document.getElementById("typing-check").onclick=()=>{ const c=cards[idx], v=document.getElementById("typing-in").value, fb=document.getElementById("typing-fb"); const ok=norm(v)===norm(c.back); fb.textContent=ok?"Correct":"Expected: "+c.back; fb.style.color=ok?"var(--success)":"var(--warn)"; gradeWord(langData.tag,c.front,ok); };
    function renderListen(){ const c=cards[idx]; if(!c) return; speak(c.back,{lang:langData.tag}); const pool=langData.words.filter(w=>w.back!==c.back).sort(()=>Math.random()-0.5).slice(0,3).map(w=>w.back); const opts=[c.back,...pool].sort(()=>Math.random()-0.5); const box=document.getElementById("listen-opts"); box.innerHTML=""; for(const o of opts){ const b=document.createElement("button"); b.className="btn btn-ghost quiz-opt"; b.textContent=o; b.onclick=()=>{ const ok=o===c.back; b.classList.add(ok?"is-right":"is-wrong"); gradeWord(langData.tag,c.front,ok); }; box.appendChild(b);} }
    document.getElementById("listen-play").onclick=()=>{ const c=cards[idx]; if(c) speak(c.back,{lang:langData.tag}); };
    function startQuiz(){ quizSet=cards.slice(0,5); qi=0; correct=0; document.getElementById("card-section").hidden=true; document.getElementById("quiz-section").hidden=false; showQ(); }
    function showQ(){ const cur=quizSet[qi]; document.getElementById("feedback").textContent=""; document.getElementById("quiz-next").hidden=true; document.getElementById("quiz-progress").textContent=`Question ${qi+1}/${quizSet.length}`; document.getElementById("quiz-q").textContent=`What does "${cur.front}" mean?`; prog(((cards.length+qi+1)/(cards.length+5))*100,`Question ${qi+1} of ${quizSet.length}`); const ch=[cur.back,...langData.words.filter(w=>w.back!==cur.back).sort(()=>Math.random()-0.5).slice(0,3).map(w=>w.back)].sort(()=>Math.random()-0.5); const box=document.getElementById("options"); box.innerHTML=""; for(const t of ch){ const b=document.createElement("button"); b.className="btn btn-ghost quiz-opt"; b.textContent=t; b.onclick=()=>{ [...box.children].forEach(x=>x.disabled=true); const ok=t===cur.back; if(ok){correct++; b.classList.add("is-right");} else b.classList.add("is-wrong"); gradeWord(langData.tag,cur.front,ok); document.getElementById("quiz-next").hidden=false; }; box.appendChild(b);} }
    document.getElementById("quiz-next").onclick=()=>{ if(qi<quizSet.length-1){qi++; showQ();} else { document.getElementById("quiz-section").hidden=true; document.getElementById("done-section").hidden=false; prog(100,"Done"); document.getElementById("score").textContent=`${correct}/${quizSet.length} in ${langData.name}`; const up=addXp(correct*10); markDone(langData.tag,correct); document.getElementById("xp-earned").textContent=`+${correct*10} XP · Total ${up.xp}`; } };
    document.getElementById("retry").onclick=()=>location.reload();
    try{ const langs=await loadLanguages(); const wanted=getQuery("lang")||store.lang||langs[0].tag; langData=langs.find(l=>l.tag===wanted)||langs[0]; const s=loadStore(); s.lang=langData.tag; saveStore(s); courseLabel.textContent=`${langData.name} · ${langData.words.length} words`; const lessonId=getQuery("lesson"); let pool=langData.words; if(lessonId&&langData.lessons?.length){ const les=langData.lessons.find(x=>x.id===lessonId); if(les?.words?.length) pool=les.words; } cards=pool.slice(0,5); showCard(); }catch{ notice.hidden=false; notice.textContent="Could not load lesson."; }
  </script>
</body>
</html>
