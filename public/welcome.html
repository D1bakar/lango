<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8" />
  <meta name="color-scheme" content="light" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><title>Welcome — Lango</title><link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="./css/fonts.css" /><link rel="stylesheet" href="./css/tokens.css" /><link rel="stylesheet" href="./css/base.css" /><link rel="stylesheet" href="./css/components.css" /><link rel="stylesheet" href="./css/app.css" /></head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="shell"></div>
<main data-content>
<div class="page-h"><p class="eyebrow">30 seconds</p><h1>Pick. Set. Start.</h1></div>
<div class="card stack"><h2 style="font-size:18px">1 · Course</h2><div id="langs" class="grid-2"></div><h2 style="font-size:18px">2 · Daily goal</h2><div style="display:flex;gap:8px"><button class="btn btn-ghost" data-g="30">30 XP</button><button class="btn btn-ghost" data-g="50">50 XP</button><button class="btn btn-ghost" data-g="100">100 XP</button></div><h2 style="font-size:18px">3 · Start</h2><a id="go" href="./languages.html" class="btn btn-primary" style="width:100%">Continue</a></div>
</main>
<script type="module">
import { loadLanguages } from "./js/loader.js";
import { loadStore, setLanguage, updateSettings } from "./js/store.js";
import { mountShell } from "./js/shell.js";
mountShell({ active: "home", layout: "narrow" });
const langs = await loadLanguages();
let sel = loadStore().lang || "ja", goal = 50;
const box = document.getElementById("langs");
for(const l of langs.slice(0,8)){
  const b=document.createElement("button"); b.className="btn btn-ghost"; b.textContent=`${l.tag.toUpperCase()} · ${l.name}`;
  b.onclick=()=>{ sel=l.tag; setLanguage(sel); [...box.children].forEach(x=>x.classList.remove("btn-primary")); b.classList.add("btn-primary"); paint(); };
  box.appendChild(b);
}
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ goal=+b.dataset.g; updateSettings({goal}); paint(); });
function paint(){ document.getElementById("go").href=`./course.html?lang=${encodeURIComponent(sel)}`; document.getElementById("go").textContent=`Start ${sel.toUpperCase()} · ${goal} XP/day`; }
paint();
</script>
</body>
</html>
