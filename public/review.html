<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8" />
  <meta name="color-scheme" content="light" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><title>Review — Lango</title><link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="./css/fonts.css" /><link rel="stylesheet" href="./css/tokens.css" /><link rel="stylesheet" href="./css/base.css" /><link rel="stylesheet" href="./css/components.css" /><link rel="stylesheet" href="./css/app.css" /></head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="shell"></div>
<main data-content>
<div class="page-h"><h1>Review</h1><p>Mastery under 4 resurfaces here.</p></div>
<div id="box" class="stack"><div class="skel"></div></div>
</main>
<script type="module">
import { loadLanguages, getQuery } from "./js/loader.js";
import { loadStore } from "./js/store.js";
import { mountShell } from "./js/shell.js";
import { dueWords, gradeWord } from "./js/srs.js";
import { speak } from "./js/tts.js";
mountShell({ active: "review", layout: "narrow" });
const langs = await loadLanguages();
const tag = getQuery("lang") || loadStore().lang || langs[0].tag;
const c = langs.find(x=>x.tag===tag) || langs[0];
const due = dueWords(c, 12);
const box = document.getElementById("box"); box.innerHTML = "";
if(!due.length) box.innerHTML = `<div class="card" style="text-align:center">All clear. No weak words in ${c.name}.<p style="margin-top:12px"><a href="./lesson.html?lang=${c.tag}" class="btn btn-primary">New lesson</a></p></div>`;
for(const w of due){
  const d=document.createElement("div"); d.className="card";
  d.innerHTML=`<strong>${w.front}</strong><p style="color:var(--muted);font-size:14px">${w.roman||""}</p><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn btn-ghost" data-a="show" style="min-height:40px">Reveal</button><button class="btn btn-ghost" data-a="hear" style="min-height:40px">Listen</button><button class="btn btn-apple" data-a="know" style="min-height:40px">Knew it</button><button class="btn btn-primary" data-a="miss" style="min-height:40px">Practice</button></div><p data-fb style="font-weight:600;margin-top:8px" hidden>${w.back}</p>`;
  d.querySelector('[data-a="show"]').onclick=()=>{ d.querySelector("[data-fb]").hidden=false; };
  d.querySelector('[data-a="hear"]').onclick=()=>speak(w.back,{lang:c.tag});
  d.querySelector('[data-a="know"]').onclick=(e)=>{ gradeWord(c.tag,w.front,true); e.target.closest(".card").style.opacity="0.5"; };
  d.querySelector('[data-a="miss"]').onclick=(e)=>{ gradeWord(c.tag,w.front,false); };
  box.appendChild(d);
}
</script>
</body>
</html>
