<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8" />
  <meta name="color-scheme" content="light" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><title>Settings — Lango</title><link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="./css/fonts.css" /><link rel="stylesheet" href="./css/tokens.css" /><link rel="stylesheet" href="./css/base.css" /><link rel="stylesheet" href="./css/components.css" /><link rel="stylesheet" href="./css/app.css" /></head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="shell"></div>
<main data-content>
<div class="page-h"><h1>Settings</h1><p>Theme, goals, audio, data.</p></div>
<div class="card stack"><label>Theme <select id="theme" class="select"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Daily goal (XP) <input id="goal" class="input" type="number" min="10" max="500" step="10" /></label><label>TTS rate <input id="rate" class="input" type="number" min="0.5" max="1.5" step="0.1" /></label><button id="save" class="btn btn-primary">Save</button></div>
<div class="card stack" style="margin-top:12px"><h2 style="font-size:18px">Data</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="exp" class="btn btn-ghost">Export</button><button id="reset" class="btn btn-ghost">Reset</button></div><textarea id="io" class="input" rows="5" placeholder="Export shows here."></textarea><button id="imp" class="btn btn-apple">Import</button></div>
</main>
<script type="module">
import { loadStore, updateSettings, clearProgress, exportProgress, importProgress } from "./js/store.js";
import { mountShell, applyTheme } from "./js/shell.js";
mountShell({ active: "settings", layout: "narrow" });
const s = loadStore();
document.getElementById("theme").value = s.settings.theme;
document.getElementById("goal").value = s.settings.goal;
document.getElementById("rate").value = s.settings.ttsRate;
document.getElementById("save").onclick = () => {
  const u = updateSettings({ theme: document.getElementById("theme").value, goal: +document.getElementById("goal").value||50, ttsRate: +document.getElementById("rate").value||1 });
  applyTheme(u.settings.theme);
};
document.getElementById("exp").onclick = () => document.getElementById("io").value = exportProgress();
document.getElementById("imp").onclick = () => { try { importProgress(document.getElementById("io").value); location.reload(); } catch { } };
document.getElementById("reset").onclick = () => { if(confirm("Clear all progress?")){ clearProgress(); location.reload(); } };
</script>
</body>
</html>
