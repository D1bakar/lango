<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Settings — Lango</title><link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="./css/fonts.css" /><link rel="stylesheet" href="./css/tokens.css" /><link rel="stylesheet" href="./css/base.css" /><link rel="stylesheet" href="./css/components.css" /></head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header class="site-header"><div class="container site-header-inner"><a href="./index.html" class="brand"><span class="brand-mark">L</span><span><span class="brand-name">Lango</span><br /><span class="brand-sub">Settings</span></span></a></header></header>
<main id="main" class="container lesson-shell">
<h1>Settings</h1>
<div class="card stack" style="margin-top:12px">
<label>Theme <select id="theme" class="select"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
<label>Daily goal (XP) <input id="goal" class="input" type="number" min="10" max="500" step="10" /></label>
<label>TTS rate <input id="rate" class="input" type="number" min="0.5" max="1.5" step="0.1" /></label>
<label style="display:flex;gap:8px;align-items:center"><input id="tts" type="checkbox" style="width:20px;height:20px" /> Enable audio</label>
<button id="save" class="btn btn-apple">Save</button>
</div>
<div class="card stack" style="margin-top:12px"><h2 style="font-size:18px">Data</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="exp" class="btn btn-ghost">Export JSON</button><button id="reset" class="btn btn-ghost">Reset progress</button></div><textarea id="io" class="input" rows="6" placeholder="Export shows here. Paste to import, then Import."></textarea><button id="imp" class="btn btn-primary">Import</button></div>
</main>
<script type="module">
import { loadStore, updateSettings, clearProgress, exportProgress, importProgress } from "./js/store.js";
import { applyTheme } from "./js/shell.js";
const s = loadStore();
document.getElementById("theme").value = s.settings.theme;
document.getElementById("goal").value = s.settings.goal;
document.getElementById("rate").value = s.settings.ttsRate;
document.getElementById("tts").checked = !!s.settings.tts;
document.getElementById("save").onclick = () => {
  const u = updateSettings({ theme: document.getElementById("theme").value, goal: +document.getElementById("goal").value||50, ttsRate: +document.getElementById("rate").value||1, tts: document.getElementById("tts").checked });
  applyTheme(u.settings.theme); alert("Saved ✓");
};
document.getElementById("exp").onclick = () => document.getElementById("io").value = exportProgress();
document.getElementById("imp").onclick = () => { try { importProgress(document.getElementById("io").value); alert("Imported ✓"); location.reload(); } catch { alert("Invalid JSON"); } };
document.getElementById("reset").onclick = () => { if(confirm("Clear all XP and mastery on this device?")){ clearProgress(); location.reload(); } };
</script>
</body>
</html>
