<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8" />
  <meta name="color-scheme" content="light" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><title>Words — Lango</title><link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="./css/fonts.css" /><link rel="stylesheet" href="./css/tokens.css" /><link rel="stylesheet" href="./css/base.css" /><link rel="stylesheet" href="./css/components.css" /><link rel="stylesheet" href="./css/app.css" /></head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="shell"></div>
<main data-content>
<div class="page-h"><h1>Words</h1><p>Every word with mastery 0–5.</p></div>
<input id="q" class="input" type="search" placeholder="Search words…" aria-label="Search words" />
<div id="list" class="stack" style="margin-top:12px"><div class="skel"></div></div>
</main>
<script type="module">
import { loadLanguages, wordKey } from "./js/loader.js";
import { loadStore } from "./js/store.js";
import { mountShell } from "./js/shell.js";
mountShell({ active: "words", layout: "mid" });
const langs = await loadLanguages();
const s = loadStore();
const all = langs.flatMap(c => (c.words||[]).map(w => ({ ...w, tag: c.tag, lang: c.name })));
function render(){
  const t = document.getElementById("q").value.toLowerCase();
  const box = document.getElementById("list"); box.innerHTML="";
  for(const w of all.filter(x => !t || (x.front+x.back+(x.roman||"")).toLowerCase().includes(t)).slice(0,120)){
    const m = s.mastery[wordKey(w.tag,w.front)] ?? 0;
    const d=document.createElement("div"); d.className="card";
    d.style.cssText="display:flex;justify-content:space-between;gap:12px;align-items:center";
    d.innerHTML=`<span><strong>${w.front} → ${w.back}</strong> <span class="pill">${w.tag.toUpperCase()} · ${m}/5</span></span><a class="btn btn-ghost" style="min-height:40px" href="./lesson.html?lang=${w.tag}">Practice</a>`;
    box.appendChild(d);
  }
}
document.getElementById("q").addEventListener("input",render); render();
</script>
</body>
</html>
