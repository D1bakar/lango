<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><title>Stats — Lango</title><link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="./css/fonts.css" /><link rel="stylesheet" href="./css/tokens.css" /><link rel="stylesheet" href="./css/base.css" /><link rel="stylesheet" href="./css/components.css" /><link rel="stylesheet" href="./css/app.css" /></head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="shell"></div>
<main data-content>
<div class="page-h"><h1>Stats</h1><p>Device only. No account.</p></div>
<div class="grid-3"><div class="card" style="text-align:center"><p id="xp" style="font-size:32px;font-weight:700">0</p><p class="eyebrow">Total XP</p></div><div class="card" style="text-align:center"><p id="streak" style="font-size:32px;font-weight:700">0</p><p class="eyebrow">Day streak</p></div><div class="card" style="text-align:center"><p id="level" style="font-size:32px;font-weight:700">1</p><p class="eyebrow">Level</p></div></div>
<div class="card" style="margin-top:16px"><h2 style="font-size:18px">Mastery by course</h2><div id="bars" class="stack" style="margin-top:12px"><div class="skel"></div></div></div>
</main>
<script type="module">
import { loadLanguages } from "./js/loader.js";
import { loadStore } from "./js/store.js";
import { mountShell } from "./js/shell.js";
import { courseProgress } from "./js/srs.js";
mountShell({ active: "stats", layout: "mid" });
const s = loadStore();
document.getElementById("xp").textContent = s.xp;
document.getElementById("streak").textContent = s.streak;
document.getElementById("level").textContent = s.level || 1;
const langs = await loadLanguages();
const box = document.getElementById("bars"); box.innerHTML = "";
for(const c of langs){
  const p = courseProgress(c);
  const d=document.createElement("div");
  d.innerHTML=`<div style="display:flex;justify-content:space-between;font-size:14px"><strong>${c.name}</strong><span style="color:var(--muted)">${p}%</span></div><div class="progress" style="margin-top:6px"><i style="width:${p}%"></i></div>`;
  box.appendChild(d);
}
</script>
</body>
</html>
